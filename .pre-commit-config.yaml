# Pre-commit hooks para Collections v0.2.0
# Instalar con:  pre-commit install
# Correr ad-hoc: pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Strict solo bajo core/, según política de CLAUDE.md sec 5.
        files: ^src/collections_app/core/

  - repo: local
    hooks:
      - id: arch-tests
        name: architecture tests (CLAUDE.md sec 2.1)
        entry: pytest tests/architecture/ -q
        language: system
        pass_filenames: false
        always_run: true
