[project]
name = "collections"
# Mantener sincronizado con src/collections_app/__init__.py (__version__).
version = "0.2.0"
description = "Aplicación para gestionar colecciones de cards/figuritas"
authors = [{name = "Tu Nombre"}]
requires-python = ">=3.11"
dependencies = [
    # Qt binding usado por la vista preservada (CardLoaderView). El resto
    # de runtime deps de v0.1 (Pillow, numpy, requests, reportlab,
    # beautifulsoup4, pypdf, packaging) se reincorporan cuando un Prompt
    # futuro las requiera.
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-qt>=4.4",
    "responses>=0.25",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"collections_app.core.db.schema" = ["*.sql"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
# legacy/ es código v0.1 archivado como referencia; no se lintea ni
# reformatea. Ver legacy/v0_1/README.md.
extend-exclude = ["legacy"]
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "ANN", "S", "C4", "SIM"]
ignore = ["S101"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]
# CardLoaderView se preserva textualmente desde v0.1 (CLAUDE.md sec 7.1).
# ANN101 (deprecada en ruff moderno) no se aplica a su forma legacy.
"src/collections_app/views/inventory/card_loader.py" = ["ANN101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = ["gui: tests que requieren display"]
