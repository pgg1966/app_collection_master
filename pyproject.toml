[project]
name = "collections"
version = "0.1.0"
description = "Aplicación para gestionar colecciones de cards/figuritas"
authors = [{name = "Tu Nombre"}]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "numpy>=1.24",
    "requests>=2.31",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-qt>=4.4",
    "responses>=0.25",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests>=2.31",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
collections-admin = "collections_app.admin.main:main"
collections-client = "collections_app.client.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"collections_app.core.db.schema" = ["*.sql"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "ANN", "S", "C4", "SIM"]
ignore = ["S101"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]
# AbmWidget es un widget genérico parametrizable; Any es deliberado.
"src/collections_app/shared_ui/widgets/abm_widget.py" = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["gui: tests que requieren display"]
